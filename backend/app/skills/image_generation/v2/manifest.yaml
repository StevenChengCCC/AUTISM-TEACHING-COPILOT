skillId: image_generation
version: v2
status: active
intendedUse:
  - Create exact non-identifying educational visuals for teacher-reviewed printable materials
  - Create varied exemplars of one confirmed concept
prohibitedUse:
  - Real learner likenesses or private information
  - Text, logos, watermarks, borders, worksheets, or card layouts inside generated art
  - Unrelated objects or concepts
inputSchemaVersion: image-generation-input-v2
outputSchemaVersion: image-generation-output-v2
promptTemplateVersion: image-generation-prompt-v2
evaluatorVersion: image-generation-evaluator-v2
teacherReviewRequired: true
sourceReviewStatus: reviewed
promptComponents: [system.md, quality_rules.yaml]
sourceReferences:
