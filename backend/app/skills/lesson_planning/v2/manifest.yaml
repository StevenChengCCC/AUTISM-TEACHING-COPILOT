skillId: lesson_planning
version: v2
status: active
intendedUse:
  - Turn one teacher request into a concise editable lesson draft
  - Present at most three high-value teacher decisions
prohibitedUse:
  - Diagnosis or treatment planning
  - Inventing a target when the teacher request is too vague to identify one
  - Asking a long interview before lesson generation
inputSchemaVersion: lesson-planning-input-v2
outputSchemaVersion: lesson-planning-output-v2
promptTemplateVersion: lesson-planning-prompt-v2
evaluatorVersion: lesson-planning-evaluator-v2
teacherReviewRequired: true
sourceReviewStatus: reviewed
promptComponents: [system.md, task.md, quality_rules.yaml]
