skillId: ny_instructional_materials
version: v2
status: active
intendedUse:
  - Apply instructional guidance checks to teacher-confirmed New York special education lesson kits
  - Evaluate measurable goals, access, prompting, visual completeness, data alignment, dignity, and print readiness
prohibitedUse:
  - Claiming legal, IEP, district, New York State, or accessibility compliance
  - Creating or changing an IEP, placement, diagnosis, behavior plan, service, or accommodation
  - Replacing teacher, CSE or CPSE, family, related-service provider, or BCBA judgment
  - Recommending restrictive, punitive, coercive, or aversive practices
