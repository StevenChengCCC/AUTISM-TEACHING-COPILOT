skillId: ny_instructional_materials
version: v1
status: active
intendedUse:
  - Improve teacher-confirmed lesson kits and printable materials for New York special education classrooms
  - Evaluate material completeness, access, dignity, instructional alignment, and print readiness
prohibitedUse:
  - Claiming legal, IEP, district, or New York State compliance
  - Creating or changing an IEP, placement, diagnosis, behavior plan, service, or accommodation
  - Replacing teacher, CSE or CPSE, family, related-service provider, or BCBA judgment
  - Recommending restrictive, punitive, coercive, or aversive practices
